name: scenario_2btg_pooling_limit_baseline_amb
seed: 42
description: 2 battalion, 1 ccp each — pooling limit baseline.
  Own R1 at 10 min, neighbor R1 at 35 min. Ambulance pooling ON, facility pooling OFF.
components:
  travel_time_matrix: components/distances/travel_time_matrix_pooling_limit.xlsx
  coordinates: components/distances/coordinates_2btg_1ccp_each.xlsx
  axp: components/AXPs/axp_2btg_1ccp_each.xlsx
  facilities: components/facilities/facilities_2btg_1ccp_each.xlsx
  units: components/units/units_2btg_1ccp_each.xlsx
  ambulances: components/ambulances/amb_2btg_1ccp_each.xlsx
  c2: components/c2/c2_2btg_1ccp_each.xlsx
policy_matrixes:
  facility_eligibility:
    0: policy_matrixes/facility_eligibility/facility_eligibility_2btg_1ccp_each_strict.xlsx
    1: policy_matrixes/facility_eligibility/facility_eligibility_2btg_1ccp_each_bn_pool.xlsx
    2: policy_matrixes/facility_eligibility/facility_eligibility_2btg_1ccp_each_bde_pool.xlsx
    3: policy_matrixes/facility_eligibility/facility_eligibility_2btg_1ccp_each_r2_bde_pool.xlsx
  ambulance_eligibility:
    0: policy_matrixes/ambulance_eligibility/ambulance_eligibility_2btg_1ccp_each_strict.xlsx
    1: policy_matrixes/ambulance_eligibility/ambulance_eligibility_2btg_1ccp_each_bn_pool.xlsx
    2: policy_matrixes/ambulance_eligibility/ambulance_eligibility_2btg_1ccp_each_bde_pool.xlsx
    3: policy_matrixes/ambulance_eligibility/ambulance_eligibility_2btg_1ccp_each_r2_bde_pool.xlsx
casualty_generation:
  config: casualty_generation_settings/sampling_settings/config_2btg_1ccp_each.yaml
dispatch_rules:
  - triage: T1
    min_count: 1
    min_wait_min: 0
  - triage: T1
    min_count: 1
    min_wait_min: 0
  - triage: T2
    min_count: 1
    min_wait_min: 0
  - triage: T2
    min_count: 1
    min_wait_min: 0
  - triage: T3
    min_count: 4000
    min_wait_min: 0
  - triage: T3
    min_count: 1
    min_wait_min: 720
levers:
  dispatch_policy: greedy
  facility_eligibility: 0
  ambulance_eligibility: 1
simulation:
  till: 7200
  trace: false
  data_collector_interval: 5.0
video:
  enabled: false
  fps: 24
  time_scale: 5.0
  dpi: 100
  state_log_interval: 5.0
  start_time: 0
  duration: null
logs:
  enabled: true
  path: simulation_logs
outputs:
  patient_log: true
  safe_patients: true
  transport_events: true
  wait_times: true
  facility_states: false
