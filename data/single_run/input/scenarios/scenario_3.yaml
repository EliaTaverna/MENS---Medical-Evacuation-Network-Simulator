name: scenario_3
description: Meisner's scenario
components:
  distance_matrix: components/distances/distance_matrix_meisner.xlsx
  axp: components/AXPs/axp_meisner.xlsx
  facilities: components/facilities/facilities_meisner.xlsx
  units: components/units/units_meisner.xlsx
  ambulances: components/ambulances/ambulances_meisner.xlsx
  c2: components/c2/c2_meisner.xlsx
policy_matrixes:
  facility_eligibility:
    0: policy_matrixes/facility_eligibility/facility_eligibility_0.xlsx
    1: policy_matrixes/facility_eligibility/facility_eligibility_1.xlsx
  ambulance_eligibility:
    0: policy_matrixes/ambulance_eligibility/ambulance_eligibility_0.xlsx
    1: policy_matrixes/ambulance_eligibility/ambulance_eligibility_1.xlsx
casualty_generation:
  from_dataset: true
  casualties_dataframe: casualty_dataframes/one_casualty_1.xlsx
  config: casualty_generation_settings/sampling_settings/config.yaml
  diagnosis_mix: casualty_generation_settings/diagnosis/diagnosis_mix.xlsx
  prescriptions: casualty_generation_settings/prescriptions/prescriptions_meisner.xlsx
levers:
  facility_eligibility: 0
  ambulance_eligibility: 0
  triage_weights:
    T1_BCAS: 3.0
    T2_BCAS: 2.0
    T3_BCAS: 1.0
    T1_DNBI: 3.0
    T2_DNBI: 2.0
    T3_DNBI: 1.0
  beta: 0.0
  gamma: 0.0
  delta: 0.0
  random_seed: 42
simulation:
  till: 500
  casualty_seed: null
  trace: false
video:
  enabled: true
  fps: 24
  time_scale: 5.0
  dpi: 100
  state_log_interval: 5.0
  duration: null
logs:
  enabled: true
  path: simulation_logs
