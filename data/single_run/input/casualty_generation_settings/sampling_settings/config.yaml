# Casualty Generation Configuration
# =================================
# Tabular data in XLSX files:
#   - diagnosis/diagnosis_mix.xlsx: all triage labels with frequencies
#   - prescriptions/prescriptions_meisner.xlsx: label, frequency, prescription
#
# spawn_map: facility_id -> {labels: [...], rate: float}
#   labels: which triage types can spawn at this facility
#   rate:   casualties per soldier per day (PAR * rate ~ Poisson mean per day)
#
# Facilities sharing identical (labels, rate) are automatically grouped
# into one stream by the generator.

par_total: 18800

n_days: 3
waves_per_day: 3
wave_duration_min: 30

seed: 42

spawn_map:
  ccp1:
    labels: [T1_BCAS, T2_BCAS, T3_BCAS, KIA, MIA]
    rate: 0.023
  ccp2:
    labels: [T1_BCAS, T2_BCAS, T3_BCAS, KIA, MIA]
    rate: 0.023
  r1_bde1:
    labels: [T1_DNBI, T2_DNBI, T3_DNBI]
    rate: 0.0013
  r1_bde2:
    labels: [T1_DNBI, T2_DNBI, T3_DNBI]
    rate: 0.0013
