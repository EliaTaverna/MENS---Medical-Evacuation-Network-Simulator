# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: BASELINE EXPLORATION — 1 BTG, 1 CCP
# ═══════════════════════════════════════════════════════════════════════════════
# LHS sweep across the 4 key uncertainties to map the mortality landscape.
# Use PRIM on the results to find the parameter region where mortality
# transitions from 0 to positive — those box edges become the OAT baselines.
#
# Design: 500 LHS scenarios × 1 policy = 500 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_1ccp_1btg_egalitarian.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# ═══════════════════════════════════════════════════════════════════════════════
uncertainties:

  - name: ccp_r1_same_bn_min
    type: integer
    lower: 5
    upper: 30

  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.08

  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 120


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  # ── Overall mortality and survival ─────────────────────────────────────────
  - death_rate
  - safe_rate

  # ── Mortality by triage and casualty type ──────────────────────────────────
  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS
  - death_rate_T1_DNBI
  - death_rate_T2_DNBI
  - death_rate_T3_DNBI

  # ── Patient counts by triage ───────────────────────────────────────────────
  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS
  - n_dead_T1_BCAS
  - n_dead_T2_BCAS
  - n_dead_T3_BCAS

  # ── Mean wait time for care (minutes) ──────────────────────────────────────
  - mean_wait_care_T1_BCAS
  - mean_wait_care_T2_BCAS
  - mean_wait_care_T3_BCAS
  - mean_wait_care_T1_DNBI
  - mean_wait_care_T2_DNBI
  - mean_wait_care_T3_DNBI

  # ── Mean wait time for transport (minutes) ─────────────────────────────────
  - mean_wait_transport_T1_BCAS
  - mean_wait_transport_T2_BCAS
  - mean_wait_transport_T3_BCAS
  - mean_wait_transport_T1_DNBI
  - mean_wait_transport_T2_DNBI
  - mean_wait_transport_T3_DNBI

  # ── Total ambulance travel time (minutes) ──────────────────────────────────
  - total_transport_time

  # ── Deaths by phase × triage ───────────────────────────────────────────────
  - n_died_ccp_wait_transport_T1
  - n_died_ccp_wait_transport_T2
  - n_died_ccp_wait_transport_T3
  - n_died_r1_wait_care_T1
  - n_died_r1_wait_care_T2
  - n_died_r1_wait_care_T3
  - n_died_r1_wait_transport_T1
  - n_died_r1_wait_transport_T2
  - n_died_r1_wait_transport_T3
  - n_died_r2_wait_care_T1
  - n_died_r2_wait_care_T2
  - n_died_r2_wait_care_T3

  # ── Median wait times per phase ────────────────────────────────────────────
  - median_wait_ccp_transport_T1
  - median_wait_ccp_transport_T2
  - median_wait_r1_care_T1
  - median_wait_r1_care_T2
  - median_wait_r1_transport_T1
  - median_wait_r1_transport_T2
  - median_wait_r2_care_T1
  - median_wait_r2_care_T2

  # ── Phase entry/completion counts ──────────────────────────────────────────
  - n_started_ccp_transport_T1
  - n_started_ccp_transport_T2
  - n_completed_ccp_transport_T1
  - n_completed_ccp_transport_T2
  - n_started_r1_care_T1
  - n_started_r1_care_T2
  - n_completed_r1_care_T1
  - n_completed_r1_care_T2
  - n_started_r1_transport_T1
  - n_started_r1_transport_T2
  - n_completed_r1_transport_T1
  - n_completed_r1_transport_T2
  - n_started_r2_care_T1
  - n_started_r2_care_T2
  - n_completed_r2_care_T1
  - n_completed_r2_care_T2

  # ── Per-phase mortality rates ──────────────────────────────────────────────
  - mortality_ccp_transport_T1
  - mortality_ccp_transport_T2
  - mortality_r1_care_T1
  - mortality_r1_care_T2
  - mortality_r1_transport_T1
  - mortality_r1_transport_T2
  - mortality_r2_care_T1
  - mortality_r2_care_T2

  # ── Queue imbalance across facilities ──────────────────────────────────────
  - mean_std_queue_dcr
  - mean_std_queue_dcs

  # ── Evacuation timeline compliance ─────────────────────────────────────────
  - frac_t2_within_timeline


# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 1000
  n_policies: 0
  uncertainty_sampler: lhs
  lever_sampler: fullfactorial
  batch_size: 50
  max_parallel: 4
