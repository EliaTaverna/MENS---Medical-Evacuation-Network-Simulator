# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT — pure exploration on scenario_3_brigades_3_battalions_big_r2e_no_r2b
# Intended for scenario discovery / feature scoring (random-forest importance,
# PRIM, CART). LHS-sampled hypercube over every knob — pooling included as
# a sampled dimension rather than a full-factorial lever, so feature scoring
# can directly attribute outcome variance to it alongside everything else.
# ═══════════════════════════════════════════════════════════════════════════════
# Recommended downstream:
#
#   from ema_workbench import load_results
#   from ema_workbench.analysis import feature_scoring, prim
#   experiments, outcomes = load_results("ema_results.tar.gz")
#   fs = feature_scoring.get_feature_scores_all(experiments, outcomes)   # RF
#   # or: box = prim.Prim(experiments, outcomes["death_rate"], threshold=0.5)
#
# Why LHS (not Sobol, not FF):
#   - Space-filling single-sample: every scenario is a fresh draw. No Saltelli
#     A/B/AB_i structure, which means feature scoring sees unbiased marginals.
#   - Batchable (unlike Sobol): run_settings.batch_size > 0 works here, and
#     workers are recycled between batches so memory stays bounded.
#   - Cheaper per insight than Sobol — RF feature importance converges well
#     below what Sobol needs for stable second-order indices.
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_3_brigades_3_battalions_big_r2e_no_r2b.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES — every knob (including pooling) as a sampled dimension
# ═══════════════════════════════════════════════════════════════════════════════

uncertainties:

  # ── Stochastic variability ─────────────────────────────────────────────────
  # Sampled across scenarios so every LHS point gets a different seed.
  - name: seed
    type: integer
    lower: 1
    upper: 10000

  # ── Casualty generation ────────────────────────────────────────────────────
  # baseline 0.05
  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.10

  # baseline 3. Upper 6 keeps waves_per_day × wave_duration_min ≤ 1440 min.
  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  # baseline 30 min. Floor 5 (below that a wave is effectively a spike).
  - name: wave_duration_min
    type: integer
    lower: 5
    upper: 240

  # Scenario simulation.till = 7200 min = 5 days → upper bound 5.
  - name: n_days
    type: integer
    lower: 1
    upper: 5

  # BCAS triage mix. Each capped at 0.5; sum ≤ 1.0 (at the boundary T3/KIA/MIA
  # all go to zero). LHS within each [0, 0.5] keeps the joint-sum distribution
  # safely under the 1.0 threshold in ~87% of pairs.
  - name: fraction_t1_bcas
    type: real
    lower: 0.0
    upper: 0.5

  - name: fraction_t2_bcas
    type: real
    lower: 0.0
    upper: 0.5

  # ── Force / doctrine ───────────────────────────────────────────────────────
  # 9 battalions total in this scenario.
  - name: n_battalions_in_combat
    type: integer
    lower: 1
    upper: 9

  # ── MTF unit capacities ────────────────────────────────────────────────────
  # baseline DCR 2, PEC 2, DCS 6
  - name: dcr_capacity
    type: integer
    lower: 1
    upper: 8

  - name: pec_capacity
    type: integer
    lower: 1
    upper: 8

  - name: dcs_capacity
    type: integer
    lower: 1
    upper: 12

  # ── Ambulance fleet — CCP→R1 leg ───────────────────────────────────────────
  # baseline 2 per R1
  - name: n_amb_r1_to_ccp
    type: integer
    lower: 1
    upper: 8

  # OBSOLETE — amb_speed removed; travel-time matrix now encodes minutes directly.
  # - name: amb_speed_ccp_r1
  #   type: integer
  #   lower: 15
  #   upper: 60

  # ── Ambulance fleet — R1→R2 leg ────────────────────────────────────────────
  # baseline total 30 (18 R1-homed + 12 AXP-homed)
  - name: n_amb_r1_r2
    type: integer
    lower: 5
    upper: 60

  # OBSOLETE — amb_speed removed; travel-time matrix now encodes minutes directly.
  # - name: amb_speed_r1_r2
  #   type: integer
  #   lower: 15
  #   upper: 60

  # ── Topology travel times (minutes) ─────────────────────────────────────────
  # baseline CCP ↔ same-BN R1: 3 min
  - name: r1_ccp_same_min
    type: real
    lower: 1
    upper: 10

  # baseline CCP ↔ neighbour-BN R1: 7 min
  - name: r1_ccp_neighbor_min
    type: real
    lower: 5
    upper: 25

  # baseline R1 ↔ same-BDE R2-enhanced: 12 min
  - name: r2_enhanced_r1_same_min
    type: real
    lower: 5
    upper: 40

  # baseline R1 ↔ neighbour-BDE R2-enhanced: 25 min
  - name: r2_enhanced_r1_neighbor_min
    type: real
    lower: 15
    upper: 60

  # ── Pooling (treated as sampled dimensions, not levers) ────────────────────
  # 0 = strict (same-unit only), 1 = loose (adds neighbor-unit).
  - name: facility_eligibility
    type: integer
    lower: 0
    upper: 1

  - name: ambulance_eligibility
    type: integer
    lower: 0
    upper: 1


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS — none. Feature scoring treats every knob uniformly.
# ═══════════════════════════════════════════════════════════════════════════════

levers: []


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# BCAS only (dnbi_rate = 0). Prescriptions: DCR / PEC / DCS paths all active.
# ═══════════════════════════════════════════════════════════════════════════════

