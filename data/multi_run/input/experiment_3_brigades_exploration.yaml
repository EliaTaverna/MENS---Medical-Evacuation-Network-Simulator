# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS — LHS exploration, one (empty) policy, batched
# ═══════════════════════════════════════════════════════════════════════════════
#
#   n_scenarios controls the LHS sample size. For RF feature importance /
#   PRIM, 1 000 – 3 000 scenarios is usually plenty for stable rankings on
#   this many dimensions (21 uncertainties here). Scale up if you see
#   top-of-ranking churn across re-runs.
#
#   batch_size splits the n_scenarios loop into chunks so worker processes
#   are recycled mid-run, keeping memory bounded. LHS is safe to batch
#   (see README "Samplers and batching") because each scenario is an
#   independent draw.
#
#   max_parallel is the number of worker processes. Raise for faster
#   wall-clock at the cost of peak RAM.
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 2000
  n_policies: 1
  uncertainty_sampler: lhs
  lever_sampler: lhs
  batch_size: 200
  max_parallel: 4
