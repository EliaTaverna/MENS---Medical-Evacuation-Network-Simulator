name: medevac_experiment_1
description: EMA Workbench experiment for MEDEVAC policy exploration
output_folder: data/multi_run/output
data_root: data/single_run/input
components:
  distance_matrix: components/distances/distance_matrix.xlsx
  axp: components/AXPs/axp.xlsx
  facilities: components/facilities/facilities.xlsx
  units: components/units/units.xlsx
  ambulances: components/ambulances/ambulances.xlsx
  c2: components/c2/c2.xlsx
policy_matrixes:
  facility_eligibility:
    0: policy_matrixes/facility_eligibility/facility_eligibility_0.xlsx
    1: policy_matrixes/facility_eligibility/facility_eligibility_1.xlsx
  ambulance_eligibility:
    0: policy_matrixes/ambulance_eligibility/ambulance_eligibility_0.xlsx
    1: policy_matrixes/ambulance_eligibility/ambulance_eligibility_1.xlsx

triage_weights:
  T1_BCAS: 3.0
  T2_BCAS: 2.0
  T3_BCAS: 1.0
  T1_DNBI: 3.0
  T2_DNBI: 2.0
  T3_DNBI: 1.0

casualty_config:
  diagnosis_mix: casualty_generation_settings/diagnosis/diagnosis_mix.xlsx
  prescriptions: casualty_generation_settings/prescriptions/prescriptions_meisner.xlsx
  spawn_map:
    ccp1:
      labels: [T1_BCAS, T2_BCAS, T3_BCAS, KIA_BCAS, MIA_BCAS]
      rate: 0.023
    ccp2:
      labels: [T1_BCAS, T2_BCAS, T3_BCAS, KIA_BCAS, MIA_BCAS]
      rate: 0.023
    r1_bde1:
      labels: [T1_DNBI, T2_DNBI, T3_DNBI]
      rate: 0.0013
    r1_bde2:
      labels: [T1_DNBI, T2_DNBI, T3_DNBI]
      rate: 0.0013
  # rate_groups: maps EMA uncertainty names to label sets they control
  rate_groups:
    rate_bcas: [T1_BCAS, T2_BCAS, T3_BCAS, KIA_BCAS, MIA_BCAS]
    rate_dnbi: [T1_DNBI, T2_DNBI, T3_DNBI]
simulation:
  till: 500.0
uncertainties:
- name: casualty_seed
  type: integer
  lower: 1
  upper: 10000
- name: par_total
  type: integer
  lower: 5000
  upper: 30000
- name: rate_bcas
  type: real
  lower: 0.005
  upper: 0.04
- name: rate_dnbi
  type: real
  lower: 0.0005
  upper: 0.005
- name: waves_per_day
  type: integer
  lower: 1
  upper: 6
- name: wave_duration_min
  type: integer
  lower: 15
  upper: 120
- name: n_days
  type: integer
  lower: 1
  upper: 7
levers:
- name: facility_eligibility
  type: integer
  lower: 0
  upper: 1
- name: ambulance_eligibility
  type: integer
  lower: 0
  upper: 1
- name: alpha
  type: real
  lower: 0.0
  upper: 5.0
- name: beta
  type: real
  lower: 0.0
  upper: 1.0
- name: gamma
  type: real
  lower: 0.0
  upper: 1.0
- name: delta
  type: real
  lower: 0.0
  upper: 1.0
outcomes:
- name: death_rate
- name: death_rate_T1_BCAS
- name: death_rate_T2_BCAS
- name: death_rate_T3_BCAS
- name: death_rate_T1_DNBI
- name: death_rate_T2_DNBI
- name: death_rate_T3_DNBI
- name: safe_rate
- name: mean_wait_care_T1_BCAS
- name: mean_wait_care_T2_BCAS
- name: mean_wait_care_T3_BCAS
- name: mean_wait_care_T1_DNBI
- name: mean_wait_care_T2_DNBI
- name: mean_wait_care_T3_DNBI
- name: mean_wait_transport_T1_BCAS
- name: mean_wait_transport_T2_BCAS
- name: mean_wait_transport_T3_BCAS
- name: mean_wait_transport_T1_DNBI
- name: mean_wait_transport_T2_DNBI
- name: mean_wait_transport_T3_DNBI
- name: total_transport_time
run_settings:
  n_scenarios: 100
  n_policies: 1
  evaluator: sequential
