# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: PRIM ON FACILITY POOLING DEMAND PATTERNS — 2 BTG, 1 CCP EACH
# ═══════════════════════════════════════════════════════════════════════════════
# LHS sweep to find demand conditions where facility pooling helps or hurts.
# Inter-bn distance fixed at 35 min (from pooling limit matrix).
# Two policies per scenario: stovepipe (fac=0, amb=0) and pool facilities
# (fac=1, amb=0). Delta computed post-hoc in analysis notebook.
#
# Design: 1000 LHS scenarios × 2 policies = 2000 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_2btg_pooling_limit_baseline_fac.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# ═══════════════════════════════════════════════════════════════════════════════
uncertainties:

  - name: ccp_r1_same_bn_min
    type: integer
    lower: 10
    upper: 20

  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.07

  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 60


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS
# ═══════════════════════════════════════════════════════════════════════════════
levers:

  - name: facility_eligibility
    type: categorical
    values: [0, 1]


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  - death_rate_T1_BCAS
  - frac_facility_cross_bn
  - frac_transport_cross_bn


# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 1000
  n_policies: 2
  uncertainty_sampler: lhs
  lever_sampler: fullfactorial
  batch_size: 50
  max_parallel: 4
