scenario: data/single_run/input/scenarios/scenario_400.yaml
output_folder: data/multi_run/output

# Full factorial of:
#   bcas_rate     × 2  (0.005, 0.05)
#   wave_duration × 5  (1, 30, 60, 120, 240 min)
#   6 battalions in combat, 3 waves per day (fixed in force structure / config)
# = 10 lever combinations × 500 seeds = 5,000 runs total

uncertainties:
- name: seed
  type: integer
  lower: 1
  upper: 10000

levers:
- name: bcas_rate
  type: categorical
  values: [0.005, 0.05]
- name: wave_duration_min
  type: categorical
  values: [1, 30, 60, 120, 240]

