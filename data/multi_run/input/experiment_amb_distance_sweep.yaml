# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: AMB POOLING DISTANCE SWEEP — BCAS 0.07
# ═══════════════════════════════════════════════════════════════════════════════
# Amb pooling on (baked into scenario). Sweep ccp_r1_same_bn_min 5–80.
# Fixed: bcas=0.07, inter_bn=70.
# 16 distances × 50 seeds = 800 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_ratio_amb.yaml
output_folder: data/multi_run/output

uncertainties:

  - name: seed
    type: integer
    lower: 1
    upper: 100000

levers:

  - name: ccp_r1_same_bn_min
    type: categorical
    values: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]

outcomes:

  # ── Mortality ──────────────────────────────────────────────────────────────
  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS

  # ── Patient counts ────────────────────────────────────────────────────────
  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS

  # ── Median wait times per phase ────────────────────────────────────────────
  - median_wait_ccp_transport_T1
  - median_wait_ccp_transport_T2
  - median_wait_r1_care_T1
  - median_wait_r1_care_T2
  - median_wait_r1_transport_T1
  - median_wait_r1_transport_T2
  - median_wait_r2_care_T1
  - median_wait_r2_care_T2

  # ── Per-phase mortality rates ──────────────────────────────────────────────
  - mortality_ccp_transport_T1
  - mortality_ccp_transport_T2
  - mortality_r1_care_T1
  - mortality_r1_care_T2
  - mortality_r1_transport_T1
  - mortality_r1_transport_T2
  - mortality_r2_care_T1
  - mortality_r2_care_T2

  # ── Pooling fractions ──────────────────────────────────────────────────────
  - frac_facility_cross_bn
  - frac_transport_cross_bn

run_settings:
  n_scenarios: 50
  n_policies: 16            # 16 distances
  uncertainty_sampler: lhs
  lever_sampler: fullfactorial
  batch_size: 50
  max_parallel: 4
