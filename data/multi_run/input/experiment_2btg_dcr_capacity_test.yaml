# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: DCR CAPACITY SWEEP — ALL POLICIES — 2 BTG, 1 CCP EACH
# ═══════════════════════════════════════════════════════════════════════════════
# Same Saltelli design as the main Sobol experiment, but with dcr_capacity
# varied as an additional uncertainty (integer 1–2).
# Baseline capacity in the xlsx is 2; this explores what happens when R1
# has fewer DCR slots per facility.
#
# NOTE: capacity=0 means DCR never treats anyone (infinite queue → everyone
# dies). That's a degenerate edge case, not a realistic scenario.
# We use 1–2 to test whether halving DCR capacity changes the story.
#
# TEST: DCR capacity sweep — quick sanity check
# 100 LHS scenarios × stovepipe only = 100 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_2btg_pooling_limit_baseline_stove.yaml
output_folder: data/multi_run/output

uncertainties:

  - name: bcas_rate
    type: real
    lower: 0.05
    upper: 0.07

  - name: ccp_r1_inter_bn_min
    type: integer
    lower: 15
    upper: 35

  - name: ccp_r1_same_bn_min
    type: integer
    lower: 10
    upper: 20

  - name: dcr_capacity
    type: integer
    lower: 1
    upper: 2

  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 60

  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

levers:

  - name: facility_eligibility
    type: categorical
    values: [0, 1]

outcomes:

  # ── Mortality ──────────────────────────────────────────────────────────────
  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS

  # ── Patient counts ────────────────────────────────────────────────────────
  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS

  # ── Median wait times per phase ────────────────────────────────────────────
  - median_wait_ccp_transport_T1
  - median_wait_ccp_transport_T2
  - median_wait_r1_care_T1
  - median_wait_r1_care_T2
  - median_wait_r1_transport_T1
  - median_wait_r1_transport_T2
  - median_wait_r2_care_T1
  - median_wait_r2_care_T2

  # ── Per-phase mortality rates ──────────────────────────────────────────────
  - mortality_ccp_transport_T1
  - mortality_ccp_transport_T2
  - mortality_r1_care_T1
  - mortality_r1_care_T2
  - mortality_r1_transport_T1
  - mortality_r1_transport_T2
  - mortality_r2_care_T1
  - mortality_r2_care_T2

  # ── Evacuation timeline compliance ──────────────────────────────────────────
  - frac_t2_within_timeline

  # ── Pooling fractions ──────────────────────────────────────────────────────
  - frac_facility_cross_bn
  - frac_transport_cross_bn

run_settings:
  n_scenarios: 100
  n_policies: 2
  uncertainty_sampler: lhs
  lever_sampler: fullfactorial
  batch_size: 0
  max_parallel: 4
