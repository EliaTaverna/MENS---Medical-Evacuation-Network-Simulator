# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: DISPATCH RULE PARAMETER SWEEP — 6 CCP, 1 BTG
# ═══════════════════════════════════════════════════════════════════════════════
# Varies the numeric parameters of dispatch rules (min_count, wait thresholds)
# while keeping the priority order fixed.  Uses the 6-CCP single-battalion
# scenario as the base topology.
#
# Design: 3 bcas_rate uncertainties × (50 seeds × 2×2×2×2×2×2 dispatch combos)
#       = 3 × 3200 = 9600 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_1ccp_1btg_egalitarian.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# ═══════════════════════════════════════════════════════════════════════════════

uncertainties:

  - name: bcas_rate
    type: categorical
    values: [0.03, 0.07]


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS
# ═══════════════════════════════════════════════════════════════════════════════

levers:

  - name: seed
    type: integer
    lower: 1
    upper: 100

  # T2 — urgent. Baseline: count=2 (pair rule), wait=240 min (safety net).

  - name: t2_min_wait_min
    type: categorical
    values: [0, 120]



# ═══════════════════════════════════════════════════════════════════════════════
