# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 2             # 3 bcas_rate levels (full factorial)
  n_policies: 200            # 50 seeds × 2^6 dispatch combos (full factorial)
  uncertainty_sampler: fullfactorial
  lever_sampler: fullfactorial
  batch_size: 50
  max_parallel: 4
