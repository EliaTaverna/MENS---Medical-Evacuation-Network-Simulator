# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT — scenario_second_test
# ═══════════════════════════════════════════════════════════════════════════════
# Topology: 1 brigade × 2 battalions; 18 CCPs; 2 R1s; NO AXPs; NO Role 2.
# Ambulances: 8 total — 4 CCP→R1 (c2_ccp_r1) + 4 R1→R2 (c2_r1_r2).
#             The 4 R1→R2 amb's exist in the sheet but are IDLE because
#             there's no Role 2 to dispatch them to.
# Prescriptions: T1/T2 BCAS → [DCR];  T3 BCAS → [PEC].  No DCS.  No DNBI.
#
# Skipped levers (don't apply to this scenario):
#   - r2_retreat_km, dcs_capacity          (no Role 2)
#   - n_amb_r1_r2  / amb_speed_r1_r2       (4 R1→R2 amb's exist but never
#                                           dispatch — sweeping them is a no-op)
#
# Applicable ambulance levers (after the c2_id fix in run_setter.py):
#   - n_amb_ccp_r1 / amb_speed_ccp_r1      (partition by c2_id == "c2_ccp_r1";
#                                           matches Fleet 1 — the 4 CCP→R1
#                                           ambulances homed at the 2 R1s)
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_second_test.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# ═══════════════════════════════════════════════════════════════════════════════

uncertainties:

  - name: seed
    type: integer
    lower: 1
    upper: 10000

  # config_second_test.yaml baseline: 0.05
  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.10

  # config_second_test.yaml baseline: 3
  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  # config_second_test.yaml baseline: 30 min
  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 240

  # 2 battalions in this scenario → valid range is [1, 2]
  - name: n_battalions_in_combat
    type: categorical
    values: [ 1, 2 ]

  # scenario_second_test has simulation.till = 7200 min = 5 days
  # (config_second_test.yaml baseline is 1 day, but we can sweep 1..5)
#  - name: n_days
#    type: integer
#    lower: 1
#    upper: 5
  # Baseline DCR capacity in units_second_test.xlsx: 2
  - name: dcr_capacity
    type: integer
    lower: 1
    upper: 10

  # Baseline PEC capacity in units_second_test.xlsx: 2
  - name: pec_capacity
    type: integer
    lower: 1
    upper: 10


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS
# ═══════════════════════════════════════════════════════════════════════════════

levers:

  # Ambulances at EACH R1 that head out to CCPs for casualty pickup.
  # Fleet size = n_amb_r1_to_ccp * number_of_R1s. This scenario has 2 R1s, so
  # values [1, 2, 4] per R1 → total fleet of [2, 4, 8].
  # Baseline in amb_second_test.xlsx: 2 per R1 (4 total on c2_ccp_r1).
  - name: n_amb_r1_to_ccp
    type: integer
    lower: 1
    upper: 10

  # Baseline ambulance speed in amb_second_test.xlsx: 30 km/h
  - name: amb_speed_ccp_r1
    type: integer
    lower: 1
    upper: 50

  # Baseline CCP↔same-bn-R1 in distance_matrix_second_test: 3 km
  - name: r1_closest_km
    type: integer
    lower: 1
    upper: 10

  # Baseline CCP↔neighbour-bn-R1: 7 km
  - name: r1_second_km
    type: integer
    lower: 10
    upper: 20

  # 0 = strict (same-bn only), 1 = loose (adds neighbour-bn)
  - name: facility_eligibility
    type: integer
    lower: 0
    upper: 1

  # 0 = strict, 1 = loose (same semantics as above, but for ambulances)
  - name: ambulance_eligibility
    type: integer
    lower: 0
    upper: 1


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# Only BCAS entries (dnbi_rate = 0) and DCR / PEC prescriptions (no DCS).
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  # ── Overall mortality and survival ────────────────────────────────────────
  - death_rate
  - safe_rate

  # ── Mortality by triage (BCAS only) ───────────────────────────────────────
  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS

  # ── Patient counts by triage ──────────────────────────────────────────────
  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS
  - n_dead_T1_BCAS
  - n_dead_T2_BCAS
  - n_dead_T3_BCAS

  # ── Mean wait times (BCAS only) ───────────────────────────────────────────
  - mean_wait_care_T1_BCAS
  - mean_wait_care_T2_BCAS
  - mean_wait_care_T3_BCAS
  - mean_wait_transport_T1_BCAS
  - mean_wait_transport_T2_BCAS
  - mean_wait_transport_T3_BCAS

  # ── Total ambulance travel time ───────────────────────────────────────────
  - total_transport_time

  # ── Queue: waiting for transport at CCP (DCR / PEC prescriptions only) ────
  - waiting_transport_ccp_t1_bcas_dcr
  - waiting_transport_ccp_t2_bcas_dcr
  - waiting_transport_ccp_t3_bcas_pec

  # ── Queue: waiting for DCR care at Role 1 ─────────────────────────────────
  - waiting_care_dcr_t1_bcas_dcr
  - waiting_care_dcr_t2_bcas_dcr

  # ── Queue: waiting for PEC care at Role 1 ─────────────────────────────────
  - waiting_care_pec_t3_bcas_pec

  # ── Transit CCP → Role 1 ──────────────────────────────────────────────────
  - transit_ccp_role1_t1_bcas_dcr
  - transit_ccp_role1_t2_bcas_dcr
  - transit_ccp_role1_t3_bcas_pec

  # ── Time in DCR care at Role 1 ────────────────────────────────────────────
  - in_care_dcr_t1_bcas_dcr
  - in_care_dcr_t2_bcas_dcr

  # ── Time in PEC care at Role 1 ────────────────────────────────────────────
  - in_care_pec_t3_bcas_pec


# ═══════════════════════════════════════════════════════════════════════════════
# ARRAY OUTCOMES
# R1 IDs in scenario_second_test: r1_br1_bt1_1, r1_br1_bt2_1
# (No DCS / Role 2 array outcomes — no such facilities.)
# ═══════════════════════════════════════════════════════════════════════════════

array_outcomes:

  - ts_transport_r1_br1_bt1_1_T1
  - ts_transport_r1_br1_bt1_1_T2
  - ts_transport_r1_br1_bt1_1_T3
  - ts_transport_r1_br1_bt2_1_T1
  - ts_transport_r1_br1_bt2_1_T2
  - ts_transport_r1_br1_bt2_1_T3


# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS — kept small so the smoke test finishes quickly.
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 100
  n_policies: 100
  uncertainty_sampler: lhs
  lever_sampler: lhs
  batch_size: 10
  max_parallel: 4
