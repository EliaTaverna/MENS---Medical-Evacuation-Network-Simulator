# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: SOBOL SA ON FACILITY POOLING USEFULNESS — 2 BTG, 1 CCP EACH
# ═══════════════════════════════════════════════════════════════════════════════
# Sobol sensitivity analysis on delta T1 mortality (fac_pool − stovepipe).
# Two policies per Saltelli row: stovepipe (fac=0, amb=0) and pool facilities
# (fac=1, amb=0). The delta is computed post-hoc in the analysis notebook.
#
# 5 uncertainties, N=512, second order → 512*(2*5+2) = 6144 Saltelli rows
# × 2 policies = 12288 runs
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_2btg_1ccp_each_facility_baseline.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# ═══════════════════════════════════════════════════════════════════════════════
uncertainties:

  - name: ccp_r1_same_bn_min
    type: integer
    lower: 10
    upper: 20

  - name: ccp_r1_inter_bn_min
    type: integer
    lower: 15
    upper: 35

  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.07

  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 60


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS
# ═══════════════════════════════════════════════════════════════════════════════
levers:

  - name: facility_eligibility
    type: categorical
    values: [0, 1]


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  - death_rate_T1_BCAS
  - frac_facility_cross_bn
  - frac_transport_cross_bn


# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 512
  n_policies: 2
  uncertainty_sampler: sobol
  lever_sampler: fullfactorial
  batch_size: 50
  max_parallel: 4
