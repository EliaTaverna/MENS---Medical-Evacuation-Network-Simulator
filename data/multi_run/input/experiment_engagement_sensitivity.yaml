scenario: data/single_run/input/scenarios/scenario_400.yaml
output_folder: data/multi_run/output

# Investigates the interplay between:
#   - casualty rate        : how intense the fighting is (uncertainty)
#   - battalions in combat : how many units are engaged  (lever — all 4 values enumerated)
#   - waves per day        : temporal pattern of casualties (uncertainty)
#   - wave duration        : how concentrated each casualty event is (uncertainty)
#
# 4 lever values × 20 LHS seeds = 80 total runs

uncertainties:
- name: seed
  type: integer
  lower: 1
  upper: 10000
- name: bcas_rate
  type: categorical
  values: [0.005, 0.02, 0.035, 0.05]
- name: waves_per_day
  type: categorical
  values: [1, 2, 3, 4]
- name: wave_duration_min
  type: categorical
  values: [1, 30, 120, 360]

levers:
- name: n_battalions_in_combat
  type: categorical
  values: [1, 2, 3, 6]

