# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════
#
#   Sobol design size (per policy), second_order=False: N * (k + 2)
#     N = n_scenarios = 256
#     k = 27 uncertainties
#     → 256 * 29 = 7 424 rows per policy
#
#   Levers: full-factorial 2×2 eligibility grid → n_policies = 4
#   Total runs: 7 424 * 4 = 29 696
#
#   For publication-quality S_i / S_ij, bump n_scenarios to 512 or 1024.
#
#   batch_size semantics for Sobol (uncertainty_sampler: sobol)
#   ──────────────────────────────────────────────────────────
#   ``batch_size > 0`` activates the CHUNKED Sobol path
#   (``run_ema_sobol_chunked`` in helpers_multi.py):
#
#     - The full Saltelli design is sampled ONCE up front.
#     - ``batch_size`` is the number of SCENARIO ROWS per chunk (not total
#       runs).  Each chunk evaluates ``batch_size × n_policies_realised`` runs.
#     - A fresh worker pool is opened per chunk, so the OS reclaims worker
#       RSS between chunks (bounds salabim/greenlet residuals).
#     - Each chunk's outputs are flushed to disk and dropped from RAM, so
#       main-process memory is bounded to roughly one chunk during the sweep.
#     - Chunks are read back in order at the end, preserving the A / B /
#       A_B^(i) pairing that S_i / S_T estimators require.
#
#   ``batch_size = 0`` falls back to the single-shot path (keeps all outcomes
#   in RAM the whole run).  Do NOT use the generic non-Sobol batching path
#   with ``uncertainty_sampler: sobol`` — it would re-invoke the sampler per
#   batch and produce B independent Saltelli designs.
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 256
  n_policies: 4
  uncertainty_sampler: sobol
  lever_sampler: ff
  # Chunk size in SCENARIO ROWS.  Total rows per policy = 7 424, so 512 gives
  # 15 chunks (14 of 512 + 1 of 256).  Each chunk evaluates
  # batch_size * n_policies_realised = 512 * 4 = 2 048 runs.
  batch_size: 512
  sobol_second_order: false
  max_parallel: 4
