# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT — Sobol sensitivity analysis on scenario_3_brigades_3_battalions_big_r2e_no_r2b
# ═══════════════════════════════════════════════════════════════════════════════
# Saltelli design: N*(k+2) runs per policy with second_order=False
# (N*(2k+2) if you flip sobol_second_order back on to get S_ij too).
# k is the number of uncertainties, N is n_scenarios below.  Sobol requires a
# continuous / integer hypercube — no categoricals — so `seed` is NOT an
# uncertainty (its variance would otherwise be attributed as S_i(seed) = noise).
#
# Here  k = 27 uncertainties, n_scenarios = 256, second_order=False
#   →  256*(27+2) = 7 424 rows per policy.
# Levers = 2×2 eligibility (pooling) grid, sampled full-factorial → 4 policies.
# Total = 29 696 runs.  Bump N (power of 2) for tighter S_i / S_T CIs.
# Flipping sobol_second_order back to true gets the S_ij interaction indices
# at the cost of nearly doubling the design (N*(2k+2) = 14 336 rows per policy).
#
# Levers are limited to the eligibility pair because those are the only
# actual policy decisions in this study (pooling strictness). Everything
# else — capacities, fleet sizes, travel times — is treated as an
# uncertainty whose sensitivity we want to quantify.
#
# Dormant tiers under the current topology (3 brigades, 3 battalions, TOROIDAL
# toggled in the dataset builder): any *_non_contig_* knob fires only when
# the ring puts pairs ≥2 hops apart — under TOROIDAL=True in a 3-ring these
# are *_NON_CONTIG_* cells that are never filled, so the Sobol sweep will
# vary them without observable effect.  They're swept anyway so results stay
# comparable if you later flip TOROIDAL or scale to N≥4.
#
# Note: dcs_capacity, n_amb_r1_r2, r1_r2_*, axp_r2_* are
# *currently* silent with the default prescriptions file (T1/T2 BCAS →
# [DCR], T3 BCAS → [PEC] — nothing routes to Role 2). They're included
# here in anticipation of prescriptions being updated to include DCS.
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_3_brigades_3_battalions_big_r2e_no_r2b.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES  (admissible / physically-plausible ranges)
# ═══════════════════════════════════════════════════════════════════════════════

uncertainties:

  # ── Casualty generation ────────────────────────────────────────────────────
  # baseline 0.05 (config_3_brigades_..._no_r2b.yaml)
  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.10

  # baseline 3. Upper bound 6 keeps wave_duration × waves_per_day ≤ 1440.
  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  # baseline 30 min. Floor 5 (below that a wave is effectively a spike).
  - name: wave_duration_min
    type: integer
    lower: 5
    upper: 240

  # Scenario simulation.till = 7200 min = 5 days  →  upper bound 5.
  - name: n_days
    type: integer
    lower: 1
    upper: 5

  # BCAS triage-mix knobs. Each is capped at 0.5; the code tolerates sums up
  # to 1.0 (at which point T3/KIA/MIA all go to zero). Sobol samples from
  # the product uniform; pathological (sum > 1) draws are vanishingly rare
  # inside floating-point tolerance and would raise ValueError if they hit.
  - name: fraction_t1_bcas
    type: real
    lower: 0.0
    upper: 0.5

  - name: fraction_t2_bcas
    type: real
    lower: 0.0
    upper: 0.5

  # ── Force / doctrine ───────────────────────────────────────────────────────
  # 9 battalions total in this scenario.
  - name: n_battalions_in_combat
    type: integer
    lower: 1
    upper: 9

  # ── MTF unit capacities (baseline 2 for both; DCS not used in scenario) ────
  - name: dcr_capacity
    type: integer
    lower: 1
    upper: 8

  - name: pec_capacity
    type: integer
    lower: 1
    upper: 8

  # ── Ambulance fleet (CCP→R1 only — R1→R2 leg is a no-op here) ──────────────
  # baseline 2 per R1
  - name: n_amb_r1_to_ccp
    type: integer
    lower: 1
    upper: 8

  # OBSOLETE — amb_speed removed; travel-time matrix now encodes minutes directly.
  # - name: amb_speed_ccp_r1
  #   type: integer
  #   lower: 15
  #   upper: 60

  # ── CCP↔R1 travel times (battalion-ring tiers) ─────────────────────────────
  # baseline CCP ↔ same-BN R1: 3 min
  - name: r1_ccp_same_min
    type: real
    lower: 1
    upper: 10

  # baseline CCP ↔ neighbour-BN R1: 7 min. Kept strictly above same-BN range.
  - name: r1_ccp_neighbor_min
    type: real
    lower: 5
    upper: 25

  # baseline CCP ↔ non-contig-BN R1: 15 min. Active only when TOROIDAL=False
  # puts some same-brigade pairs ≥2 battalion-hops apart (e.g. bt1↔bt3 in a
  # linear chain of 3). Kept strictly above neighbour-BN range.
  - name: r1_ccp_non_contig_min
    type: real
    lower: 12
    upper: 40

  # ── R1↔R1 travel times (battalion-ring within brigade + flat cross-brigade) ─
  # baseline neighbour-BN R1↔R1: 10 min
  - name: r1_r1_neighbor_min
    type: real
    lower: 5
    upper: 25

  # baseline non-contig-BN R1↔R1: 20 min (dormant under toroidal 3-ring)
  - name: r1_r1_non_contig_min
    type: real
    lower: 15
    upper: 40

  # baseline cross-brigade R1↔R1: 30 min. Flat value applied to every
  # inter-brigade R1 pair (R1-homed R1→R2 pickup leg under loose eligibility).
  - name: r1_r1_inter_bde_min
    type: real
    lower: 20
    upper: 60

  # ── R1↔AXP travel times (brigade-ring tiers) ───────────────────────────────
  # baseline same-BDE R1↔AXP: 5 min
  - name: r1_axp_same_min
    type: real
    lower: 2
    upper: 15

  # baseline neighbour-BDE R1↔AXP: 15 min
  - name: r1_axp_neighbor_min
    type: real
    lower: 10
    upper: 35

  # baseline non-contig-BDE R1↔AXP: 30 min (dormant under toroidal 3-ring)
  - name: r1_axp_non_contig_min
    type: real
    lower: 25
    upper: 60

  # ── R2 capacity / R1→R2 transport ──────────────────────────────────────────
  # baseline DCS capacity at each R2-enhanced: 6
  - name: dcs_capacity
    type: integer
    lower: 1
    upper: 12

  # baseline R1→R2 fleet total: 30 (all AXP-homed)
  - name: n_amb_r1_r2
    type: integer
    lower: 5
    upper: 60

  # OBSOLETE — amb_speed removed; travel-time matrix now encodes minutes directly.
  # - name: amb_speed_r1_r2
  #   type: integer
  #   lower: 15
  #   upper: 60

  # ── R1↔R2 travel times (brigade-ring tiers; R2b + R2e uniform) ─────────────
  # baseline same-BDE R1↔R2: 12 min
  - name: r1_r2_same_min
    type: real
    lower: 5
    upper: 30

  # baseline neighbour-BDE R1↔R2: 25 min
  - name: r1_r2_neighbor_min
    type: real
    lower: 15
    upper: 60

  # baseline non-contig-BDE R1↔R2: 50 min (dormant under toroidal 3-ring)
  - name: r1_r2_non_contig_min
    type: real
    lower: 40
    upper: 90

  # ── AXP↔R2 travel times (brigade-ring tiers; R2b + R2e uniform) ────────────
  # baseline same-BDE AXP↔R2: 8 min
  - name: axp_r2_same_min
    type: real
    lower: 3
    upper: 20

  # baseline neighbour-BDE AXP↔R2: 20 min
  - name: axp_r2_neighbor_min
    type: real
    lower: 12
    upper: 45

  # baseline non-contig-BDE AXP↔R2: 40 min (dormant under toroidal 3-ring)
  - name: axp_r2_non_contig_min
    type: real
    lower: 30
    upper: 80


# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS — the eligibility pair (2×2 full factorial → 4 policies)
# Pooling is the only real policy decision; everything else is sampled as
# an uncertainty above.
# ═══════════════════════════════════════════════════════════════════════════════

levers:

  # 0 = strict (same-BN only), 1 = loose (adds neighbour-BN)
  - name: facility_eligibility
    type: integer
    lower: 0
    upper: 1

  # 0 = strict, 1 = loose (same semantics, for ambulance routing)
  - name: ambulance_eligibility
    type: integer
    lower: 0
    upper: 1


# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# BCAS only (dnbi_rate = 0). Prescriptions: DCR / PEC only (no DCS).
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  # ── Overall mortality and survival ────────────────────────────────────────
  - death_rate
  - safe_rate

  # ── Mortality by BCAS triage ──────────────────────────────────────────────
  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS

  # ── Patient and death counts ──────────────────────────────────────────────
  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS
  - n_dead_T1_BCAS
  - n_dead_T2_BCAS
  - n_dead_T3_BCAS

  # ── Mean wait times (minutes) ─────────────────────────────────────────────
  - mean_wait_care_T1_BCAS
  - mean_wait_care_T2_BCAS
  - mean_wait_care_T3_BCAS
  - mean_wait_transport_T1_BCAS
  - mean_wait_transport_T2_BCAS
  - mean_wait_transport_T3_BCAS

  # ── Ambulance travel ──────────────────────────────────────────────────────
  - total_transport_time

  # ── Queue phases (DCR / PEC paths only) ───────────────────────────────────
  - waiting_transport_ccp_t1_bcas_dcr
  - waiting_transport_ccp_t2_bcas_dcr
  - waiting_transport_ccp_t3_bcas_pec
  - waiting_care_dcr_t1_bcas_dcr
  - waiting_care_dcr_t2_bcas_dcr
  - waiting_care_pec_t3_bcas_pec
  - transit_ccp_role1_t1_bcas_dcr
  - transit_ccp_role1_t2_bcas_dcr
  - transit_ccp_role1_t3_bcas_pec
  - in_care_dcr_t1_bcas_dcr
  - in_care_dcr_t2_bcas_dcr
  - in_care_pec_t3_bcas_pec


