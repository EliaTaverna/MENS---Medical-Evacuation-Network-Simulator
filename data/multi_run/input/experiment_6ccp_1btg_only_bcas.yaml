  - n_completed_r1_transport_T2
  - n_started_r2_care_T1
  - n_started_r2_care_T2
  - n_completed_r2_care_T1
  - n_completed_r2_care_T2

  # ── Per-phase mortality rates (8) ──────────────────────────────────────────
  # Fraction of patients who entered a phase but died during it
  - mortality_ccp_transport_T1
  - mortality_ccp_transport_T2
  - mortality_r1_care_T1
  - mortality_r1_care_T2
  - mortality_r1_transport_T1
  - mortality_r1_transport_T2
  - mortality_r2_care_T1
  - mortality_r2_care_T2

  # ── Queue imbalance across facilities (2) ──────────────────────────────────
  # Mean over time of std dev of queue length across same-echelon facilities
  - mean_std_queue_dcr             # DCR queue imbalance across R1s
  - mean_std_queue_dcs             # DCS queue imbalance across R2s

  # ── Evacuation timeline compliance (1) ─────────────────────────────────────
  - frac_t2_within_timeline        # fraction of T2 meeting R1≤1h AND R2≤2h from CCP


