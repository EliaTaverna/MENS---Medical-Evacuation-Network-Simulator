# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT TEMPLATE
# ═══════════════════════════════════════════════════════════════════════════════
# This template lists EVERY available uncertainty, lever, and outcome.
# It is directly runnable. To create a new experiment, copy this file,
# rename it, and comment out or remove what you don't need.
# Every experiment YAML is a subset of this template.
#
# Any parameter can be placed under either 'uncertainties' or 'levers'
# depending on whether you treat it as something you don't control
# (uncertainty) or a policy decision you want to compare (lever).
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_6ccp_1btg.yaml
output_folder: data/multi_run/output


# ═══════════════════════════════════════════════════════════════════════════════
# UNCERTAINTIES
# Sampled across EMA scenarios. Each scenario is one combination of values.
# ═══════════════════════════════════════════════════════════════════════════════

uncertainties:

  # Fraction of personnel-at-risk (PAR) that become casualties per wave.
  # Overrides the bcas_rate from the sampling config for every spawning point
  # whose labels contain "BCAS".
  # Range: must be > 0. Realistic values are roughly [0.005, 0.05].
  #   0.005 = low-intensity engagement (~5 casualties per 1000 PAR per wave)
  #   0.05  = high-intensity engagement (~50 casualties per 1000 PAR per wave)
  # Baseline in config_400.yaml: 0.023
  - name: bcas_rate
    type: categorical
    values: [0.03, 0.05, 0.07]



# ═══════════════════════════════════════════════════════════════════════════════
# LEVERS
# Policy choices sampled across EMA policies.
# ═══════════════════════════════════════════════════════════════════════════════

levers:
  - name: seed
    type: integer
    lower: 1
    upper: 100
#  # ── Tier 1: intra-battalion ───────────────────────────────────────────────
#  - name: ccp_r1_same_bn_min
#    type: real
#    lower: 5
#    upper: 20
#
#  # ── Tier 2: inter-battalion (same brigade) ──────────────────────────────
#  - name: ccp_r1_inter_bn_min
#    type: real
#    lower: 20
#    upper: 45
#
#  # r1_r1_inter_bn_min — REMOVED: no C2 ever routes R1→R1
#
#  # ── Tier 3: intra-brigade (vertical) ────────────────────────────────────
#  - name: axp_r1_same_bde_min
#    type: real
#    lower: 45
#    upper: 75
#
#  - name: r1_r2_same_bde_min
#    type: real
#    lower: 45
#    upper: 75
#
#  # ── Tier 4: inter-brigade ───────────────────────────────────────────────
#  - name: axp_r1_other_bde_min
#    type: real
#    lower: 75
#    upper: 120
#
#  - name: r1_r2_other_bde_min
#    type: real
#    lower: 75
#    upper: 120
#
#  # r2_r2_other_bde_min — REMOVED: no C2 ever routes R2→R2
#
#  # Overrides the capacity (max simultaneous patients) of every DCS unit
#  # across all facilities.
#  # Range: >= 1. Check units.xlsx for the baseline capacity.
#  #   Setting this too low creates a bottleneck at Role 2; setting it very
#  #   high effectively removes the surgical constraint.
#  - name: dcs_capacity
#    type: integer
#    lower: 1
#    upper: 10
#
#  # Overrides the capacity of every PEC unit across all facilities.
#  # Range: >= 1. Check units.xlsx for the baseline capacity.
#  - name: pec_capacity
#    type: integer
#    lower: 1
#    upper: 10
#
#  # Overrides the capacity of every DCR unit across all facilities.
#  # Range: >= 1. Check units.xlsx for the baseline capacity.
#  - name: dcr_capacity
#    type: integer
#    lower: 1
#    upper: 10
#
#  # Sets the total number of ambulances on the forward leg (CCP -> R1).
#  # Identified by start_loc_id prefix "axp_".
#  # If n > current count: random ambulances are duplicated with new unique IDs,
#  # registered with the owning C2 and inheriting the source row of the
#  # ambulance_eligibility matrices.
#  # If n < current count: random ambulances are removed from ambulance_df,
#  # the C2 roster and the eligibility matrices.
#  # Range: >= 1. Upper bound is open — you can duplicate above baseline.
#  - name: n_amb_ccp_r1
#    type: integer
#    lower: 1
#    upper: 16
#
#  # Sets the total number of ambulances on the rearward leg (R1 -> R2).
#  # Identified by start_loc_id prefix "r1_". Same duplicate/remove semantics
#  # as n_amb_ccp_r1.
#  - name: n_amb_r1_r2
#    type: integer
#    lower: 1
#    upper: 36
#
#  # OBSOLETE — amb_speed_ccp_r1 and amb_speed_r1_r2 have been removed.
#  # The distance matrix has been replaced with a travel-time matrix (minutes),
#  # so ambulance speed is no longer a separate parameter.
#  # - name: amb_speed_ccp_r1
#  #   type: real
#  #   lower: 20
#  #   upper: 80
#  # - name: amb_speed_r1_r2
#  #   type: real
#  #   lower: 20
#  #   upper: 80

#  # ── Per-pair travel-time overrides ──────────────────────────────────────────
#  # Override an arbitrary single entry in the travel-time matrix (minutes).
#  # Lever name pattern:   tt_<facility_id_1>__<facility_id_2>
#  # The separator is a DOUBLE underscore because facility IDs themselves use
#  # single underscores (e.g. r1_bn_1_1). Both tt[a,b] and tt[b,a] are set to
#  # the lever value. Applied AFTER r2_retreat and r1_access, so an explicit
#  # override always wins. Unknown IDs raise at run time.
#  # Add one block per pair you want to sweep. Examples (uncomment to use):
#  # - name: tt_r1_1__r2b_1
#  #   type: real
#  #   lower: 2
#  #   upper: 60
#  # - name: tt_ccp_1__r1_1
#  #   type: real
#  #   lower: 1
#  #   upper: 30
#
#  # Selects which facility eligibility matrix to load. The matrix determines
#  # which destination facilities are allowed for each origin.
#  # Range: depends on how many matrices are defined in the scenario YAML.
#  #   4 levels: 0 = strict, 1 = bn_pool, 2 = bde_pool, 3 = r2_bde_pool
#  #   strict     — CCP→own-bn R1, R1→own-bde R2
#  #   bn_pool    — CCP→any-bn-in-bde R1, R1→own-bde R2
#  #   bde_pool   — CCP→any-bn-in-bde R1, R1→any-bde R2
#  #   r2_bde_pool— CCP→own-bn R1, R1→any-bde R2
#  - name: facility_eligibility
#    type: integer
#    lower: 0
#    upper: 3
#
#  # Selects which ambulance eligibility matrix to load. The matrix determines
#  # which ambulances can serve which facilities.
#  # Range: depends on how many matrices are defined in the scenario YAML.
#  #   4 levels: 0 = strict, 1 = bn_pool, 2 = bde_pool, 3 = r2_bde_pool
#  #   (same crossing logic as facility_eligibility)
#  - name: ambulance_eligibility
#    type: integer
#    lower: 0
#    upper: 3
##
##  # The ambulance dispatch algorithm used by C2 nodes.
##  # Range: currently only "greedy" is implemented.
##  #   Add new values here when alternative dispatch algorithms are built.
##  # - name: dispatch_policy
##  #   type: categorical
##  #   values: [greedy]
