# ═══════════════════════════════════════════════════════════════════════════════
# RUN SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

run_settings:
  n_scenarios: 3             # 3×3×3 full factorial (bcas_rate × waves × duration)
  n_policies: 100               # 15 seeds × 4 ambulance_eligibility = 60 FF policies
  uncertainty_sampler: fullfactorial     # lhs | fullfactorial | mc
  lever_sampler: fullfactorial # lhs | fullfactorial | mc
  batch_size: 0               # 0 = no batching (FF generates exact count)
  max_parallel: 4             # worker processes (1 = sequential)