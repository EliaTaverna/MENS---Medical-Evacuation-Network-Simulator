# ═══════════════════════════════════════════════════════════════════════════════
# SCALAR OUTCOMES
# One value per run, saved to results.csv.
# Comment out any line to exclude that outcome from the experiment.
# ═══════════════════════════════════════════════════════════════════════════════

outcomes:

  # ── Overall mortality and survival ─────────────────────────────────────────
  - death_rate                # fraction of all patients who died
  - safe_rate                 # fraction of all patients who reached definitive care

  # ── Mortality by triage and casualty type ──────────────────────────────────
  - death_rate_T1_BCAS        # T1 battle casualties: fraction who died
  - death_rate_T2_BCAS        # T2 battle casualties: fraction who died
  - death_rate_T3_BCAS        # T3 battle casualties: fraction who died
  - death_rate_T1_DNBI        # T1 non-battle injuries: fraction who died
  - death_rate_T2_DNBI        # T2 non-battle injuries: fraction who died
  - death_rate_T3_DNBI        # T3 non-battle injuries: fraction who died

  # ── Patient counts by triage ───────────────────────────────────────────────
  - n_patients_T1_BCAS        # total T1 BCAS patients generated
  - n_patients_T2_BCAS        # total T2 BCAS patients generated
  - n_patients_T3_BCAS        # total T3 BCAS patients generated
  - n_dead_T1_BCAS            # absolute number of T1 BCAS deaths
  - n_dead_T2_BCAS            # absolute number of T2 BCAS deaths
  - n_dead_T3_BCAS            # absolute number of T3 BCAS deaths

  # ── Mean wait time for care (minutes) ──────────────────────────────────────
  # Time from arrival at a facility to start of treatment
  - mean_wait_care_T1_BCAS
  - mean_wait_care_T2_BCAS
  - mean_wait_care_T3_BCAS
  - mean_wait_care_T1_DNBI
  - mean_wait_care_T2_DNBI
  - mean_wait_care_T3_DNBI

  # ── Mean wait time for transport (minutes) ─────────────────────────────────
  # Time from arrival at a facility to departure by ambulance
  - mean_wait_transport_T1_BCAS
  - mean_wait_transport_T2_BCAS
  - mean_wait_transport_T3_BCAS
  - mean_wait_transport_T1_DNBI
  - mean_wait_transport_T2_DNBI
  - mean_wait_transport_T3_DNBI

  # ── Total ambulance travel time (minutes) ──────────────────────────────────
  - total_transport_time      # sum of all ambulance trip durations

  # ── Phase durations (from patient_log) ─────────────────────────────────────
  # Dynamically generated based on observed (triage, prescription) combinations.
  # The naming pattern is:
  #   waiting_transport_{facility_type}_{triage}_{prescription}
  #   waiting_care_{care_type}_{triage}_{prescription}
  #   transit_{from_type}_{to_type}_{triage}_{prescription}
  #   in_care_{care_type}_{triage}_{prescription}
  #
  # The full set depends on the prescriptions in your diagnosis/prescription
  # files. For scenario_400 with prescriptions [DCR,DCS], [DCR], [PEC,DCS],
  # [PEC], the complete list is below. Remove DNBI lines if dnbi_rate = 0.

  # ── Queue: waiting for transport at CCP (12) ──────────────────────────────
  - waiting_transport_ccp_t1_bcas_dcr_dcs
  - waiting_transport_ccp_t1_bcas_dcr
  - waiting_transport_ccp_t2_bcas_dcr_dcs
  - waiting_transport_ccp_t2_bcas_dcr
  - waiting_transport_ccp_t3_bcas_pec_dcs
  - waiting_transport_ccp_t3_bcas_pec
  - waiting_transport_ccp_t1_dnbi_dcr_dcs
  - waiting_transport_ccp_t1_dnbi_dcr
  - waiting_transport_ccp_t2_dnbi_dcr_dcs
  - waiting_transport_ccp_t2_dnbi_dcr
  - waiting_transport_ccp_t3_dnbi_pec_dcs
  - waiting_transport_ccp_t3_dnbi_pec

  # ── Queue: waiting for transport at Role 1 (6) ────────────────────────────
  - waiting_transport_role1_t1_bcas_dcr_dcs
  - waiting_transport_role1_t2_bcas_dcr_dcs
  - waiting_transport_role1_t3_bcas_pec_dcs
  - waiting_transport_role1_t1_dnbi_dcr_dcs
  - waiting_transport_role1_t2_dnbi_dcr_dcs
  - waiting_transport_role1_t3_dnbi_pec_dcs

  # ── Queue: waiting for DCR care at Role 1 (8) ─────────────────────────────
  - waiting_care_dcr_t1_bcas_dcr_dcs
  - waiting_care_dcr_t1_bcas_dcr
  - waiting_care_dcr_t2_bcas_dcr_dcs
  - waiting_care_dcr_t2_bcas_dcr
  - waiting_care_dcr_t1_dnbi_dcr_dcs
  - waiting_care_dcr_t1_dnbi_dcr
  - waiting_care_dcr_t2_dnbi_dcr_dcs
  - waiting_care_dcr_t2_dnbi_dcr

  # ── Queue: waiting for PEC care at Role 1 (4) ─────────────────────────────
  - waiting_care_pec_t3_bcas_pec_dcs
  - waiting_care_pec_t3_bcas_pec
  - waiting_care_pec_t3_dnbi_pec_dcs
  - waiting_care_pec_t3_dnbi_pec

  # ── Queue: waiting for DCS surgery at Role 2 (6) ──────────────────────────
  - waiting_care_dcs_t1_bcas_dcr_dcs
  - waiting_care_dcs_t2_bcas_dcr_dcs
  - waiting_care_dcs_t3_bcas_pec_dcs
  - waiting_care_dcs_t1_dnbi_dcr_dcs
  - waiting_care_dcs_t2_dnbi_dcr_dcs
  - waiting_care_dcs_t3_dnbi_pec_dcs

  # ── Phase duration: transit CCP -> Role 1 (12) ────────────────────────────
  - transit_ccp_role1_t1_bcas_dcr_dcs
  - transit_ccp_role1_t1_bcas_dcr
  - transit_ccp_role1_t2_bcas_dcr_dcs
  - transit_ccp_role1_t2_bcas_dcr
  - transit_ccp_role1_t3_bcas_pec_dcs
  - transit_ccp_role1_t3_bcas_pec
  - transit_ccp_role1_t1_dnbi_dcr_dcs
  - transit_ccp_role1_t1_dnbi_dcr
  - transit_ccp_role1_t2_dnbi_dcr_dcs
  - transit_ccp_role1_t2_dnbi_dcr
  - transit_ccp_role1_t3_dnbi_pec_dcs
  - transit_ccp_role1_t3_dnbi_pec

  # ── Phase duration: transit Role 1 -> Role 2 (6) ──────────────────────────
  - transit_role1_role2_t1_bcas_dcr_dcs
  - transit_role1_role2_t2_bcas_dcr_dcs
  - transit_role1_role2_t3_bcas_pec_dcs
  - transit_role1_role2_t1_dnbi_dcr_dcs
  - transit_role1_role2_t2_dnbi_dcr_dcs
  - transit_role1_role2_t3_dnbi_pec_dcs

  # ── Phase duration: time in DCR care at Role 1 (8) ────────────────────────
  - in_care_dcr_t1_bcas_dcr_dcs
  - in_care_dcr_t1_bcas_dcr
  - in_care_dcr_t2_bcas_dcr_dcs
  - in_care_dcr_t2_bcas_dcr
  - in_care_dcr_t1_dnbi_dcr_dcs
  - in_care_dcr_t1_dnbi_dcr
  - in_care_dcr_t2_dnbi_dcr_dcs
  - in_care_dcr_t2_dnbi_dcr

  # ── Phase duration: time in PEC care at Role 1 (4) ────────────────────────
  - in_care_pec_t3_bcas_pec_dcs
  - in_care_pec_t3_bcas_pec
  - in_care_pec_t3_dnbi_pec_dcs
  - in_care_pec_t3_dnbi_pec

  # ── Phase duration: time in DCS surgery at Role 2 (6) ─────────────────────
  - in_care_dcs_t1_bcas_dcr_dcs
  - in_care_dcs_t2_bcas_dcr_dcs
  - in_care_dcs_t3_bcas_pec_dcs
  - in_care_dcs_t1_dnbi_dcr_dcs
  - in_care_dcs_t2_dnbi_dcr_dcs
  - in_care_dcs_t3_dnbi_pec_dcs

  # ── Deaths by phase × triage (12) ──────────────────────────────────────────
  # Number of patients who died while in each evacuation phase, by triage class
  - n_died_ccp_wait_transport_T1
  - n_died_ccp_wait_transport_T2
  - n_died_ccp_wait_transport_T3
  - n_died_r1_wait_care_T1
  - n_died_r1_wait_care_T2
  - n_died_r1_wait_care_T3
  - n_died_r1_wait_transport_T1
  - n_died_r1_wait_transport_T2
  - n_died_r1_wait_transport_T3
  - n_died_r2_wait_care_T1
  - n_died_r2_wait_care_T2
  - n_died_r2_wait_care_T3

  # ── Median wait times per phase (6) ───────────────────────────────────────
  # Median minutes spent waiting (survivors only) — complements the mean_wait_*
  - median_wait_ccp_transport_T1
  - median_wait_ccp_transport_T2
  - median_wait_r1_care_T1
  - median_wait_r1_care_T2
  - median_wait_r1_transport_T1
  - median_wait_r1_transport_T2
  - median_wait_r2_care_T1
  - median_wait_r2_care_T2

  # ── Phase entry/completion counts (16) ─────────────────────────────────────
  # How many patients entered (started) and completed each phase
  - n_started_ccp_transport_T1
  - n_started_ccp_transport_T2
  - n_completed_ccp_transport_T1
  - n_completed_ccp_transport_T2
  - n_started_r1_care_T1
  - n_started_r1_care_T2
  - n_completed_r1_care_T1
  - n_completed_r1_care_T2
  - n_started_r1_transport_T1
  - n_started_r1_transport_T2
