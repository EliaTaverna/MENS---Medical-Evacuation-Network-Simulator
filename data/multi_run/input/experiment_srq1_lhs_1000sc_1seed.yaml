# ═══════════════════════════════════════════════════════════════════════════════
# EXPERIMENT: SRQ1 — LHS convergence, 1000 scenarios, 1 seed
# ═══════════════════════════════════════════════════════════════════════════════
# LHS on uncertainties, FF on levers (2×2 eligibility → 4 policies).
# Total: 1000 × 4 = 4,000 runs.
# ═══════════════════════════════════════════════════════════════════════════════

scenario: data/single_run/input/scenarios/scenario_2btg_fixed_high_bcas.yaml
output_folder: data_cluster/srq1_lhs_convergence

uncertainties:

  - name: bcas_rate
    type: real
    lower: 0.01
    upper: 0.07

  - name: waves_per_day
    type: integer
    lower: 1
    upper: 6

  - name: wave_duration_min
    type: integer
    lower: 1
    upper: 60

  - name: ccp_r1_same_bn_min
    type: integer
    lower: 10
    upper: 20

  - name: ccp_r1_inter_bn_min
    type: integer
    lower: 15
    upper: 35

levers:

  - name: facility_eligibility
    type: integer
    lower: 0
    upper: 1

  - name: ambulance_eligibility
    type: integer
    lower: 0
    upper: 1

outcomes:

  - death_rate_T1_BCAS
  - death_rate_T2_BCAS
  - death_rate_T3_BCAS

  - n_patients_T1_BCAS
  - n_patients_T2_BCAS
  - n_patients_T3_BCAS

  - median_wait_ccp_transport_T1
  - median_wait_ccp_transport_T2
  - median_wait_r1_care_T1
  - median_wait_r1_care_T2
  - median_wait_r1_transport_T1
  - median_wait_r1_transport_T2
  - median_wait_r2_care_T1
  - median_wait_r2_care_T2

  - mortality_ccp_transport_T1
  - mortality_ccp_transport_T2
  - mortality_r1_care_T1
  - mortality_r1_care_T2
  - mortality_r1_transport_T1
  - mortality_r1_transport_T2
  - mortality_r2_care_T1
  - mortality_r2_care_T2

  - frac_t2_within_timeline
  - frac_facility_cross_bn
  - frac_transport_cross_bn

run_settings:
  n_scenarios: 1000
  n_policies: 4
  uncertainty_sampler: lhs
  lever_sampler: ff
  batch_size: 30000
  max_parallel: 5
